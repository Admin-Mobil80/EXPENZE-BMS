name: Deploy BMS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for OIDC: id-token lets the job ask GitHub for a signed token that
# AWS trades for temporary credentials. No access keys are stored anywhere.
permissions:
  id-token: write
  contents: read

# One deploy at a time. Two overlapping runs would race the sync and could
# leave the bucket holding a mix of two commits.
concurrency:
  group: deploy-bms
  cancel-in-progress: false

env:
  # us-east-1 because CloudFront certificates may only be issued there, so both
  # site stacks live there. Its own bucket and its own distribution, separate
  # from the portal's: this console is ours, not a customer's.
  AWS_REGION: us-east-1
  DEPLOY_ROLE_ARN: arn:aws:iam::231427841372:role/expenze-github-deploy
  BUCKET: expenze-bms-231427841372
  DISTRIBUTION_ID: E1H8OQ41Q2MVGV

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # No build step and nothing fingerprinted: two hand-written HTML files,
      # both entry points, neither cacheable. A cached copy keeps whoever is
      # running the platform looking at the previous release.
      #
      # Two passes, because `--content-type` applies to every object in the
      # sync and this repo is no longer only HTML. One flag stamped the icons
      # as `text/html; charset=utf-8`, and a browser handed an .ico labelled
      # HTML simply does not draw it.
      #
      # The first pass carries `--delete` and covers everything; the second
      # only rewrites the content type on the HTML.
      - name: Sync
        run: |
          aws s3 sync . "s3://$BUCKET/" \
            --delete \
            --exclude ".git/*" --exclude ".github/*" \
            --exclude ".gitignore" --exclude "README.md" --exclude ".DS_Store" \
            --cache-control "no-cache, must-revalidate"

      - name: Stamp the HTML content type
        run: |
          aws s3 cp "s3://$BUCKET/" "s3://$BUCKET/" \
            --recursive --exclude "*" --include "*.html" \
            --metadata-directive REPLACE \
            --cache-control "no-cache, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      # Waited on, not fired and forgotten. A green tick while the old files are
      # still being served teaches everybody to distrust the tick.
      - name: Invalidate CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" --query 'Invalidation.Id' --output text)
          echo "Invalidation $ID created; waiting for it to complete."
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" --id "$ID"
          echo "https://bms.expenze.ai is serving ${GITHUB_SHA:0:7}."
